<dialog class="pw-weapon-picker character-backpack" id="character-backpack" aria-labelledby="backpack-title" data-endpoint="/characters/{{ character.id }}/backpack">
  <div class="pw-weapon-picker-form">
    <header class="pw-weapon-picker-heading">
      <div><h2 id="backpack-title">Backpack</h2><p>Browse carried items or record your own.</p></div>
      <button class="icon-button" type="button" data-close-backpack aria-label="Close Backpack">×</button>
    </header>
    <div class="pw-equipment-tabs" role="tablist" aria-label="Backpack Item Groups">
      {% for key, label in [('all', 'All Items'), ('material', 'Special Materials'), ('misc', 'Miscellaneous')] %}
      <button type="button" role="tab" id="backpack-tab-{{ key }}" data-backpack-tab="{{ key }}" aria-controls="backpack-results" aria-selected="{{ 'true' if loop.first else 'false' }}"{% if not loop.first %} tabindex="-1"{% endif %}>{{ label }}</button>
      {% endfor %}
    </div>
    <div id="backpack-results" role="tabpanel" aria-labelledby="backpack-tab-all">
      <div class="pw-weapon-filters backpack-filters">
        <label>Search By Name<input type="search" id="backpack-search" autocomplete="off" autofocus></label>
        <label>Category<select id="backpack-category"><option value="">All Categories</option></select></label>
      </div>
      <p class="pw-weapon-result-count" id="backpack-status" role="status"></p>
      <div id="backpack-list" class="pw-weapon-results" tabindex="0" role="region" aria-label="Backpack Items">
        <table>
          <thead><tr><th scope="col">Item</th><th scope="col">Qty</th><th scope="col">Value Each</th><th scope="col">Total Value</th><th scope="col">Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <form id="backpack-add" class="pw-weapon-picker-footer">
      <div class="backpack-fields">
        <label class="field"><span>Item Name</span><input name="name" maxlength="150" required></label>
        <label class="field"><span>Quantity</span><input name="quantity" type="number" min="1" max="1000000" step="1" value="1" required></label>
        <label class="field"><span>Value Per Item (gp)</span><input name="value" type="number" min="0" max="1000000" step="0.01" required></label>
      </div>
      <p class="pw-weapon-submit-error" id="backpack-error" role="alert" hidden></p>
      <div class="pw-weapon-picker-actions"><button class="button primary" type="submit">Add Item</button></div>
    </form>
  </div>
  <script type="application/json" id="backpack-items">{{ backpack_items|tojson }}</script>
</dialog>
