<dialog class="treasure-dialog character-treasure" id="character-treasure" aria-labelledby="treasure-title">
<div class="treasure-modal-heading"><h2 id="treasure-title">Treasure</h2><button class="treasure-close" type="button" id="close-treasure" aria-label="Close Treasure">×</button></div>
<p class="treasure-balance">On Hand <output id="treasure-total" tabindex="0" data-sheet-formula="On-hand value in gold pieces = copper pieces ÷ 100 + silver pieces ÷ 10 + gold pieces + platinum pieces × 10." title="On-hand value in gold pieces = copper pieces ÷ 100 + silver pieces ÷ 10 + gold pieces + platinum pieces × 10.">{{ treasure_gp ~ ' gp' if treasure_gp is not none else 'Check coin amounts' }}</output></p>
<div class="treasure-content">
<div class="treasure-coins">
{% for coin,label,gp in coin_types %}<div class="treasure-coin" data-treasure-coin="{{ coin }}"><label for="ds-money.{{ coin }}">{{ sheet_label(label) }} <span>({{ coin }})</span></label><div class="treasure-coin-controls"><input id="ds-money.{{ coin }}" name="money.{{ coin }}" type="number" value="{{ deluxe.get('money.' ~ coin,'') or '0' }}" min="0" max="1000000000" step="any" aria-label="{{ sheet_label(label) }} ({{ coin }})" readonly><button type="button" class="treasure-remove" data-remove-coins="{{ coin }}" aria-label="Remove All {{ sheet_label(label) }}" title="Remove All {{ sheet_label(label) }}">×</button></div><span class="treasure-rate">1 {{ coin }} = {{ gp }} gp</span></div>{% endfor %}
</div>
<div class="treasure-footer"><a href="https://www.aonprd.com/Rules.aspx?ID=107" target="_blank" rel="noopener noreferrer">Coin Exchange Table ↗</a>{{ source_note('https://www.aonprd.com/Rules.aspx?ID=107') }}<div class="treasure-actions"><button type="button" class="button small" id="add-treasure">Add Coins</button></div></div>
<p id="treasure-validation" class="treasure-validation" role="status" hidden></p>
</div></dialog>
