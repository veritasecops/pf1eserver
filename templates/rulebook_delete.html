{% extends 'base.html' %}
{% block content %}
<header class="page-header"><h1>Delete rulebook</h1></header>
<section class="card form-card">
  <h2>{{ book.title }}</h2>
  <p>This permanently removes the PDF, its cover, searchable page text, and indexing jobs from the library.</p>
  <form method="post" action="/rulebooks/{{ book.id }}/delete">
    {{ csrf_input(csrf) }}
    <input type="hidden" name="confirm" value="delete">
    <div class="row">
      <button class="button danger" type="submit">Delete PDF permanently</button>
      <a class="button" href="/rulebooks">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
