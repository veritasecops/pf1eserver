{% extends 'base.html' %}
{% block content %}
<header class="page-header">
  <div><h1>Upload rulebook</h1><p>Upload a PDF and choose which role can see it in the library.</p></div>
  <a class="button" href="/rulebooks">Back to library</a>
</header>
{% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/rulebooks/upload" enctype="multipart/form-data" class="card form-card">
  {{ csrf_input(csrf) }}
  <label class="field"><span>Title</span><input name="title" value="{{ book_title }}" maxlength="150" required></label>
  <label class="field"><span>Access role</span><select name="access_role" required>
    <option value="">Choose a role</option>
    {% for key, label in access_roles.items() %}<option value="{{ key }}"{% if key == access_role %} selected{% endif %}>{{ label }}</option>{% endfor %}
  </select></label>
  <label class="field"><span>PDF file</span><input type="file" name="pdf" accept=".pdf,application/pdf" required><span class="secondary-text">Up to 50 MB. The first page becomes the cover.</span></label>
  <button class="button primary" type="submit">Upload PDF</button>
</form>
{% endblock %}
