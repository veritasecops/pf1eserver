# Include this file inside nginx's http {} context, for example through
# /opt/homebrew/etc/nginx/servers/*.conf or /etc/nginx/conf.d/*.conf.
# Point pathkeeper.yonkovator.com at the nginx proxy's address.
# HTTP only, as requested.
# These zones must remain outside server {}, inside the including http {}.
limit_req_zone $binary_remote_addr zone=pathkeeper_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=pathkeeper_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name pathkeeper.yonkovator.com;
    server_tokens off;

    # Also reject unexpected hosts if this site becomes nginx's default site.
    if ($http_host !~* "^pathkeeper\.yonkovator\.com(?::80)?$") {
        return 444;
    }
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
        return 405;
    }

    client_max_body_size 256k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    reset_timedout_connection on;

    # Allow page/asset bursts; clients sharing an IP share these limits.
    limit_req zone=pathkeeper_requests burst=60 nodelay;
    limit_req_status 429;
    limit_conn pathkeeper_connections 30;
    limit_conn_status 429;

    # Account verification, password reset, and invitation URLs contain tokens.
    access_log off;
    # Ordinary request errors can also log token URLs. Temporarily lower this
    # threshold only for controlled debugging; protect any resulting logs.
    error_log stderr crit;

    # Apply these headers to nginx-generated errors as well as app responses.
    # Replace the upstream copies to avoid duplicate headers; preserve app CSP.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ (^|/)\. {
        return 404;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host pathkeeper.yonkovator.com;
    proxy_set_header X-Real-IP $remote_addr;
    # This nginx instance is the client-facing proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host pathkeeper.yonkovator.com;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_set_header Proxy "";
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://10.0.0.156:8080;
    }

    location = /rulebooks/upload {
        client_max_body_size 501m;
        proxy_request_buffering off;
        proxy_pass http://10.0.0.156:8080;
    }
}
